services:
  - type: web
    name: staffadmin-backend
    env: python
    region: oregon
    plan: free
    branch: deploy-render-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://xueqvozgeebhlffxmiqp.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: OPTIMIZER_API_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.12.0
