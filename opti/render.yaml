services:
  - type: web
    name: staffadmin-optimizer
    env: python
    region: oregon
    plan: free
    branch: deploy-render-optimizer
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn optimizer_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: https://xueqvozgeebhlffxmiqp.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
